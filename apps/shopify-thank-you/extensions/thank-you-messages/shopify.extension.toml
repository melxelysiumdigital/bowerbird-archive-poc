api_version = "2026-04"

[[extensions]]
uid = "11fa5d05-2255-bdc0-1715-d0dc09dcefe6b554e4f8"
type = "ui_extension"
name = "Thank You Messages"
handle = "thank-you-messages"

[[extensions.targeting]]
module = "./src/ThankYouMessages.jsx"
target = "purchase.thank-you.block.render"

[[extensions.targeting]]
module = "./src/ThankYouMessages.jsx"
target = "customer-account.order-status.block.render"

[extensions.capabilities]
api_access = true

[extensions.settings]

[[extensions.settings.fields]]
key = "product_handle"
type = "single_line_text_field"
name = "Product handle"
description = "URL handle of the product that triggers this message (e.g. \"membership\" or \"donate\")"

[[extensions.settings.fields]]
key = "min_amount"
type = "number_decimal"
name = "Minimum amount"
description = "Only show if matching line items total at least this amount (0 = any amount)"

[[extensions.settings.fields]]
key = "message"
type = "multi_line_text_field"
name = "Message"
description = "Message to display when the product is in the order"

[[extensions.settings.fields]]
key = "banner_title"
type = "single_line_text_field"
name = "Banner title"
description = "Optional heading shown above the message"

[[extensions.settings.fields]]
key = "banner_status"
type = "single_line_text_field"
name = "Banner style"
description = "Banner appearance: info, success, warning, or critical (default: info)"

[[extensions.settings.fields]]
key = "show_debug"
type = "boolean"
name = "Show debug info"
description = "Show product matching details instead of the message (disable for production)"
